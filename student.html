<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#06101f">
  <link rel="icon" type="image/png" href="logo.png?v=3">
  <title>U.C.C Institute - Student App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #06101f;
      --bg-2: #0a182e;
      --surface: #0f213d;
      --surface-2: #142a4d;
      --surface-soft: rgba(15, 33, 61, 0.85);
      --gold-light: #fae19a;
      --gold: #e5b84b;
      --gold-deep: #b8861d;
      --gold-grad: linear-gradient(135deg, #f8df91 0%, #dfa935 55%, #b88217 100%);
      --gold-soft: rgba(229, 184, 75, 0.13);
      --gold-border: rgba(229, 184, 75, 0.32);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-2: #cbd5e1;
      --muted: #8fa3bf;
      --success: #34d399;
      --success-soft: rgba(16, 185, 129, 0.15);
      --danger: #f87171;
      --danger-soft: rgba(239, 68, 68, 0.15);
      --shadow-sm: 0 4px 16px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 18px 40px rgba(0, 0, 0, 0.45);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', 'Hind Siliguri', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      background: radial-gradient(circle at top right, #12294d 0%, var(--bg) 52%, #040b16 100%);
      background-attachment: fixed;
      color: var(--text);
      padding-bottom: 94px;
      overscroll-behavior-y: contain;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    input, select { user-select: text; }
    svg { flex-shrink: 0; }

    /* ===== SPLASH SCREEN ===== */
    #splashScreen {
      position: fixed; inset: 0; z-index: 999;
      background: radial-gradient(circle at 75% 20%, #173461 0%, #071326 55%, #030912 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 24px;
      transition: opacity 0.45s cubic-bezier(0.4, 0, 0.2, 1), transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #splashScreen.hide { opacity: 0; transform: scale(1.05); pointer-events: none; }
    .splash-ring {
      width: 116px; height: 116px; border-radius: 50%; padding: 4px;
      background: var(--gold-grad);
      box-shadow: 0 0 0 10px rgba(229, 184, 75, 0.12), 0 20px 45px rgba(0, 0, 0, 0.55);
      animation: popIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .splash-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #fff; display: block; }
    .splash-title {
      margin: 20px 0 6px; font-size: 26px; font-weight: 800; letter-spacing: -0.3px;
      background: linear-gradient(90deg, #ffffff 0%, var(--gold-light) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      opacity: 0; animation: slideUp 0.55s ease 0.2s forwards;
    }
    .splash-tag {
      margin: 0; color: var(--gold-light); font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase;
      padding: 6px 16px; border-radius: 30px; background: var(--gold-soft);
      border: 1px solid var(--gold-border);
      opacity: 0; animation: slideUp 0.55s ease 0.35s forwards;
    }
    .splash-bar { width: 130px; height: 4px; border-radius: 99px; background: rgba(255,255,255,0.12); margin-top: 28px; overflow: hidden; }
    .splash-fill { height: 100%; width: 0%; border-radius: 99px; background: var(--gold-grad); animation: loadBar 1.15s ease 0.25s forwards; }

    @keyframes popIn { 0% { opacity: 0; transform: scale(0.6); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { 0% { opacity: 0; transform: translateY(14px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes loadBar { to { width: 100%; } }
    @keyframes pageFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulseDot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.35); opacity: 0.45; } }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

    /* ===== ROYAL LOGIN SCREEN ===== */
    #loginScreen {
      position: fixed; inset: 0; z-index: 200;
      background: radial-gradient(circle at 20% 15%, #163360 0%, #071326 55%, #030912 100%);
      display: flex; justify-content: center; align-items: center; padding: 20px; overflow: hidden;
    }
    .login-orb-1, .login-orb-2 { position: absolute; border-radius: 50%; filter: blur(65px); pointer-events: none; }
    .login-orb-1 { width: 240px; height: 240px; background: rgba(229, 184, 75, 0.2); top: -70px; right: -50px; }
    .login-orb-2 { width: 260px; height: 260px; background: rgba(37, 99, 235, 0.16); bottom: -80px; left: -60px; }
    .login-card {
      position: relative; width: 100%; max-width: 375px;
      background: linear-gradient(165deg, #102342 0%, #0a172c 100%);
      border: 1px solid var(--gold-border); border-radius: 26px;
      padding: 28px 24px 24px; box-shadow: 0 26px 65px rgba(0, 0, 0, 0.6);
      animation: slideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .login-card::before {
      content: ''; position: absolute; top: 0; left: 26px; right: 26px; height: 3px;
      background: var(--gold-grad); border-radius: 0 0 6px 6px;
    }
    .login-logo-wrap {
      width: 76px; height: 76px; border-radius: 50%; padding: 3px;
      background: var(--gold-grad); margin: 0 auto 13px;
      box-shadow: 0 10px 25px rgba(229, 184, 75, 0.28);
    }
    .login-logo-wrap img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #fff; display: block; }
    .login-title { text-align: center; margin-bottom: 20px; }
    .login-title h2 { margin: 0; color: #fff; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
    .login-title p { margin: 4px 0 0; font-size: 11px; color: var(--gold); font-weight: 700; letter-spacing: 1.8px; }
    .login-err {
      display: none; background: var(--danger-soft); color: #fecaca; border: 1px solid rgba(248, 113, 113, 0.4);
      padding: 10px 12px; border-radius: 12px; font-size: 12.5px; font-weight: 600; margin-bottom: 14px; text-align: center;
    }

    /* ===== TOP HEADER ===== */
    header {
      background: rgba(6, 16, 31, 0.88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 30;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.35);
    }
    header::after {
      content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 1.5px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
      opacity: 0.75;
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-logo {
      width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
      border: 2px solid var(--gold); background: #fff;
      box-shadow: 0 0 12px rgba(229, 184, 75, 0.3);
    }
    .brand h1 { margin: 0; font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -0.2px; }
    .brand small { font-size: 11px; color: var(--gold-light); display: block; font-weight: 600; margin-top: 1px; opacity: 0.9; }
    .hdr-actions { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px; height: 36px; border-radius: 11px; border: 1px solid var(--gold-border);
      background: rgba(229, 184, 75, 0.08); color: var(--gold-light); cursor: pointer;
      display: flex; align-items: center; justify-content: center; transition: 0.18s ease;
    }
    .icon-btn:active { transform: scale(0.92); background: rgba(229, 184, 75, 0.2); }

    /* ===== CONTAINER & DARK LUXURY CARDS ===== */
    .container { max-width: 580px; margin: 14px auto; padding: 0 14px; }
    .page { display: none; }
    .page.active { display: block; animation: pageFade 0.28s ease; }

    .card {
      background: linear-gradient(160deg, var(--surface) 0%, #0b1930 100%);
      border-radius: var(--radius); padding: 16px;
      box-shadow: var(--shadow-sm); margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title {
      font-size: 14.5px; font-weight: 800; color: #fff;
      display: flex; align-items: center; gap: 8px;
    }
    .pill-mini {
      font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
      background: var(--gold-soft); color: var(--gold-light); border: 1px solid var(--gold-border);
    }

    /* ===== GOLDEN NOTICE BANNER ===== */
    .notice-banner {
      background: linear-gradient(135deg, rgba(229, 184, 75, 0.16) 0%, rgba(184, 130, 23, 0.08) 100%);
      border: 1px solid var(--gold-border); border-left: 4px solid var(--gold);
      border-radius: 16px; padding: 13px 14px; margin-bottom: 14px;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);
    }
    .notice-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
    .notice-badge { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800; color: var(--gold-light); }
    .live-dot {
      width: 8px; height: 8px; border-radius: 50%; background: #ef4444;
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25); animation: pulseDot 1.3s infinite;
    }
    .notice-date { font-size: 11px; font-weight: 600; color: var(--gold-light); background: rgba(0,0,0,0.28); padding: 2px 9px; border-radius: 20px; }
    .notice-body { font-size: 13.5px; color: #f1f5f9; line-height: 1.5; font-weight: 500; }
    .notice-link {
      display: inline-flex; align-items: center; gap: 5px; margin-top: 9px;
      background: var(--gold-grad); color: #06101f; text-decoration: none;
      font-size: 12px; font-weight: 800; padding: 6px 14px; border-radius: 9px;
    }

    /* ===== ROYAL HERO STUDENT CARD ===== */
    .hero-card {
      position: relative; overflow: hidden;
      background: linear-gradient(135deg, #132c54 0%, #0c1d38 55%, #162a47 100%);
      color: #fff; border-radius: 22px; padding: 18px; margin-bottom: 14px;
      border: 1px solid var(--gold-border); box-shadow: var(--shadow-lg);
    }
    .hero-card::before {
      content: ''; position: absolute; width: 190px; height: 190px; border-radius: 50%;
      background: radial-gradient(circle, rgba(229, 184, 75, 0.26) 0%, transparent 70%);
      top: -65px; right: -55px; pointer-events: none;
    }
    .hero-card::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: var(--gold-grad);
    }
    .hero-row { position: relative; display: flex; align-items: center; gap: 14px; }
    .avatar-circle {
      width: 54px; height: 54px; border-radius: 16px;
      background: var(--gold-grad); color: #06101f; font-size: 22px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 20px rgba(229, 184, 75, 0.32);
    }
    .hero-name { font-size: 19px; font-weight: 800; letter-spacing: -0.2px; color: #fff; }
    .hero-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .hero-chip {
      font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px;
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14); color: #e2e8f0;
    }
    .hero-chip.gold { background: var(--gold-soft); border-color: var(--gold-border); color: var(--gold-light); }
    .hero-footer {
      position: relative; margin-top: 14px; padding-top: 12px;
      border-top: 1px solid rgba(229, 184, 75, 0.16);
      display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-2);
    }

    /* ===== STATS & GOLDEN PROGRESS ===== */
    .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
    .stat-box {
      background: linear-gradient(160deg, var(--surface) 0%, #0b1930 100%);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 13px 8px; text-align: center; box-shadow: var(--shadow-sm);
    }
    .stat-icon {
      width: 32px; height: 32px; border-radius: 10px; margin: 0 auto 7px;
      display: flex; align-items: center; justify-content: center;
    }
    .si-green { background: var(--success-soft); color: var(--success); }
    .si-gold { background: var(--gold-soft); color: var(--gold-light); }
    .si-red { background: var(--danger-soft); color: var(--danger); }
    .stat-num { font-size: 17.5px; font-weight: 800; letter-spacing: -0.3px; }
    .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; font-weight: 600; }

    .prog-track { width: 100%; height: 8px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; margin-top: 9px; }
    .prog-fill { height: 100%; border-radius: 99px; background: var(--gold-grad); transition: width 0.5s ease; }

    /* ===== MONTHS GRID ===== */
    .months-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .m-cell {
      border: 1px solid var(--border); border-radius: 13px; padding: 9px 4px;
      text-align: center; background: rgba(255, 255, 255, 0.03);
    }
    .m-cell .m-name { font-size: 11.5px; font-weight: 700; color: var(--text-2); }
    .m-cell .m-val { font-size: 11px; font-weight: 700; margin-top: 3px; color: var(--muted); }
    .m-cell.paid {
      background: linear-gradient(160deg, rgba(16, 185, 129, 0.18) 0%, rgba(229, 184, 75, 0.12) 100%);
      border-color: rgba(52, 211, 153, 0.45);
    }
    .m-cell.paid .m-name { color: #a7f3d0; }
    .m-cell.paid .m-val { color: var(--success); }

    /* ===== SEGMENTED PILLS (CLASSES) ===== */
    .seg-bar {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      background: #091528; border: 1px solid var(--border); padding: 5px; border-radius: 14px; margin-bottom: 14px;
    }
    .seg-btn {
      padding: 9px 4px; border-radius: 10px; border: none; background: transparent;
      font-weight: 700; font-size: 12.5px; cursor: pointer; color: var(--muted);
      display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.2s ease;
    }
    .seg-btn.active {
      background: var(--gold-grad); color: #06101f; font-weight: 800;
      box-shadow: 0 4px 14px rgba(229, 184, 75, 0.28);
    }
    .seg-btn.live-tab.active { background: linear-gradient(135deg, #f87171, #dc2626); color: #fff; }

    .lock-card {
      background: linear-gradient(160deg, var(--surface) 0%, #0b1930 100%);
      border: 1.5px solid var(--gold-border); border-radius: 22px;
      padding: 30px 20px; text-align: center; box-shadow: var(--shadow-lg);
    }
    .lock-icon-circle {
      width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 14px;
      background: var(--gold-soft); color: var(--gold-light);
      display: flex; align-items: center; justify-content: center; border: 2px solid var(--gold-border);
    }

    /* ===== SUBJECT -> CHAPTER FOLDERS ===== */
    details.sub-folder {
      background: linear-gradient(160deg, var(--surface) 0%, #0b1930 100%);
      border: 1px solid var(--border); border-left: 3px solid var(--gold);
      border-radius: 16px; margin-bottom: 11px; overflow: hidden; box-shadow: var(--shadow-sm);
    }
    details.sub-folder > summary {
      padding: 14px 15px; font-size: 14.5px; font-weight: 800; color: #fff;
      cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
    }
    details.sub-folder > summary::-webkit-details-marker { display: none; }
    .folder-left { display: flex; align-items: center; gap: 10px; }
    .folder-ic {
      width: 34px; height: 34px; border-radius: 10px; background: var(--gold-soft); color: var(--gold-light);
      display: flex; align-items: center; justify-content: center; border: 1px solid var(--gold-border);
    }
    .sub-body { padding: 0 12px 12px; }

    details.chap-folder {
      background: rgba(6, 16, 31, 0.55); border: 1px solid var(--border); border-radius: 13px; margin-top: 8px;
    }
    details.chap-folder > summary {
      padding: 11px 12px; font-size: 13.5px; font-weight: 700; color: var(--gold-light);
      cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center;
    }
    details.chap-folder > summary::-webkit-details-marker { display: none; }
    .chap-body { padding: 0 10px 10px; }

    .content-card {
      background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
      padding: 13px; margin-top: 8px;
    }
    .c-badge {
      display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 20px; background: var(--gold-soft); color: var(--gold-light);
      border: 1px solid var(--gold-border);
    }
    .c-badge.live { background: var(--danger-soft); color: #fca5a5; border-color: rgba(248,113,113,0.4); }
    .video-box {
      margin-top: 10px; border-radius: 12px; overflow: hidden; background: #000;
      aspect-ratio: 16 / 9; width: 100%; border: 1px solid var(--gold-border);
    }
    .video-box iframe { width: 100%; height: 100%; border: none; }

    /* ===== LIVE Q&A CHAT ===== */
    .live-chat-wrap {
      margin-top: 12px; background: rgba(6, 16, 31, 0.7); border: 1px solid var(--border);
      border-radius: 14px; padding: 12px;
    }
    .chat-list { max-height: 210px; overflow-y: auto; margin-bottom: 10px; }
    .chat-msg {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 8px 11px; font-size: 12.5px; margin-bottom: 7px; color: #f1f5f9;
    }
    .chat-msg.admin { background: var(--gold-soft); border-color: var(--gold-border); }

    /* ===== LUXURY BLACK-GOLD UPI CARD ===== */
    .upi-card {
      position: relative; overflow: hidden;
      background: linear-gradient(135deg, #1b1710 0%, #0c172b 52%, #231c0f 100%);
      color: #fff; border-radius: 20px; padding: 18px; margin-bottom: 16px;
      border: 1px solid var(--gold-border); box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
    }
    .upi-card::before {
      content: ''; position: absolute; width: 160px; height: 160px; border-radius: 50%;
      background: radial-gradient(circle, rgba(229, 184, 75, 0.3) 0%, transparent 70%);
      top: -55px; right: -40px; pointer-events: none;
    }
    .upi-top { display: flex; justify-content: space-between; align-items: center; position: relative; }
    .upi-tag { font-size: 10.5px; font-weight: 800; letter-spacing: 1.4px; color: var(--gold-light); text-transform: uppercase; }
    .upi-num {
      font-size: 24px; font-weight: 800; letter-spacing: 2px; margin: 10px 0 6px; position: relative;
      background: var(--gold-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .copy-pill {
      position: relative; background: var(--gold-soft); color: var(--gold-light);
      border: 1px solid var(--gold-border); padding: 7px 13px; border-radius: 10px;
      font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    }
    .copy-pill:active { transform: scale(0.95); background: rgba(229, 184, 75, 0.28); }

    /* ===== DARK FORM ELEMENTS ===== */
    .form-group { margin-bottom: 13px; }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--gold-light); margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 11px 13px; border: 1.5px
